<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arif Sadik terminal header</title>
  <desc id="desc">A minimal terminal showing whoami, focus and uptime.</desc>
  <rect width="1200" height="330" rx="18" fill="#0b0f14"/>
  <rect x="1" y="1" width="1198" height="328" rx="17" fill="none" stroke="#263241"/>
  <rect x="0" y="0" width="1200" height="46" rx="18" fill="#111821"/>
  <rect x="0" y="29" width="1200" height="17" fill="#111821"/>
  <circle cx="28" cy="23" r="6" fill="#46515e"/>
  <circle cx="50" cy="23" r="6" fill="#46515e"/>
  <circle cx="72" cy="23" r="6" fill="#46515e"/>
  <text x="600" y="28" text-anchor="middle" fill="#8d9aaa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">arif@github ~</text>

  <text x="48" y="87" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">$ whoami</text>
  <text x="48" y="113" fill="#f0f3f6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">arif sadik</text>

  <text x="48" y="153" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">$ focus</text>
  <text x="48" y="179" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">full-stack · automation · robotics · cloud</text>

  <text x="48" y="219" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">$ next</text>
  <text x="48" y="245" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">devops / cloud engineer</text>

  <text x="48" y="285" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">$ uptime</text>
  <text x="155" y="285" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">learning continuously.</text>
  <rect x="356" y="273" width="9" height="17" fill="#7ee787">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>